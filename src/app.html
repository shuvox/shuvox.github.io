<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- Google Fonts: preconnect for speed, then non-blocking load -->
	<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
		media="print"
		onload="this.media='all'"
	/>
	<noscript>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
	</noscript>

	<!-- Inline script: apply dark/light mode before first paint to avoid FOUC -->
	<script>
		(function () {
			try {
				var stored = localStorage.getItem('persistent_store');
				var darkMode = stored ? JSON.parse(stored).darkMode : true;
				if (darkMode !== false) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {
				document.documentElement.classList.add('dark');
			}
		})();
	</script>

	<!-- Primary Meta Tags -->
	<title>Shadman Shuvo — BUET CSE Undergrad & Full-Stack Developer</title>
	<meta name="title" content="Shadman Shuvo — BUET CSE Undergrad & Full-Stack Developer" />
	<meta name="description" content="Portfolio of Shadman Shuvo — Computer Science & Engineering undergraduate at BUET, Full-Stack Developer and Machine Learning enthusiast based in Dhaka, Bangladesh." />
	<meta name="author" content="Shadman Shuvo" />
	<meta name="robots" content="index, follow" />

	<!-- Open Graph / Facebook / LinkedIn -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://shuvox.github.io/" />
	<meta property="og:title" content="Shadman Shuvo — BUET CSE Undergrad & Full-Stack Developer" />
	<meta property="og:description" content="Portfolio of Shadman Shuvo — Computer Science & Engineering undergraduate at BUET, Full-Stack Developer and Machine Learning enthusiast based in Dhaka, Bangladesh." />
	<meta property="og:image" content="https://shuvox.github.io/og-image.jpg" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:image:alt" content="Shadman Shuvo — BUET CSE Undergrad & Full-Stack Developer" />
	<meta property="og:site_name" content="Shadman Shuvo Portfolio" />
	<meta property="og:locale" content="en_US" />

	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:url" content="https://shuvox.github.io/" />
	<meta name="twitter:title" content="Shadman Shuvo — BUET CSE Undergrad & Full-Stack Developer" />
	<meta name="twitter:description" content="Portfolio of Shadman Shuvo — Computer Science & Engineering undergraduate at BUET, Full-Stack Developer and Machine Learning enthusiast based in Dhaka, Bangladesh." />
	<meta name="twitter:image" content="https://shuvox.github.io/og-image.jpg" />
	<meta name="twitter:image:alt" content="Shadman Shuvo — BUET CSE Undergrad & Full-Stack Developer" />

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
